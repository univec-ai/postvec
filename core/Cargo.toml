[package]
name = "postvec-core"
version = "0.1.0"
edition = "2021"
license = "PostgreSQL"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "time"] }
