[workspace]
resolver = "2"
# postvec is a pgrx extension (edition 2024, cdylib built via cargo-pgrx) and
# builds standalone, exactly as it did in the monorepo.
exclude = ["postvec"]
members = [
    "postvec-cli",
    "engine",
    "shared",
    "registry/schema",
    "fixtures/inference-server",
    "postvec-server",
]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
