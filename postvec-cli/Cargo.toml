[package]
name = "postvec-cli"
version = "0.2.0"
edition = "2021"
description = "Install, uninstall and diagnose the postvec PostgreSQL extension"
# Released together with, and version-locked to, the extension — see
# packaging/postvec/scripts/assert-versions.sh. The licence text is
# postvec/LICENSE (one file for both halves of the same release).
license = "PostgreSQL"
readme = "README.md"
repository = "https://github.com/univec-ai/postvec"
homepage = "https://github.com/univec-ai/postvec/tree/main/postvec-cli"
authors = ["the UniVec authors"]

# The installed binary is `postvec` (the crate name is `postvec-cli` because
# `postvec` is the pgrx extension crate, which lives outside this workspace).
[[bin]]
name = "postvec"
path = "src/main.rs"

[features]
# Test-only trust bypass: compiles in the POSTVEC_REGISTRY_*_INDEX_URL
# overrides (and their relaxed HTTP/loopback transport) so the integration
# suite can serve loopback fixtures. Never enable this in a build that
# ships or that runs with real credentials. Packaging uses the default
# feature set, which does not contain it. The registry_pull tests are
# gated on it and compile to nothing without it.
registry-test-overrides = ["postvec-registry/registry-test-overrides"]

[dependencies]
# Every version here is already resolved in the workspace lockfile; the CLI
# deliberately introduces no second PostgreSQL driver and no second TLS stack.
anyhow = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
humantime = "2"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Shared registry index schema: one implementation for the CLI and the
# publisher, so they cannot disagree about what a published model is.
registry-schema = { path = "../registry/schema", features = ["archive"] }
postvec-registry = { path = "../registry/client" }
semver = "1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
# The provider connector clients (the `provider add`/`test` verification
# probe and the built-in catalog). No `wire` feature: the CLI edits
# providers.d files as TOML documents itself and never runs the gateway.
# `config` (not `wire`): the providers.d schema and its structural
# validation, so doctor reports what the serving host will actually do with a
# file. No gateway, no `shared`, no secret resolution.
postvec-providers = { path = "../providers", features = ["config"] }
toml = "0.8"
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
] }
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time", "io-util", "io-std", "sync"] }
url = "2"
walkdir = "2"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
# The in-process mock provider, so the CLI's probe tests are hermetic: a test
# that asserts "no provider call was made" must not be able to make one.
postvec-providers = { path = "../providers", features = ["config", "test-util"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }

[lints.clippy]
# The CLI is a long linear orchestration; these two fire constantly on
# check-producing functions and say nothing useful about them.
too_many_arguments = "allow"
