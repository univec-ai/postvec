# Detached debug information for the `postvec` command.
#
# Separate from the extension's debug package for the same reason the CLI
# itself is separate: /usr/bin/postvec is owned by one package regardless of
# how many PostgreSQL majors are installed, so its symbols must be too.
# Bundling them into a per-major debug package would make two majors' debug
# packages conflict.
#
# The file sits at /usr/lib/debug/usr/bin/postvec.debug — the mirrored path
# where gdb and coredumpctl look.

name: postvec-cli-${DEBUG_SUFFIX}
arch: ${PKG_ARCH}
platform: linux
version: ${POSTVEC_VERSION}
release: ${PKG_RELEASE}
section: debug
priority: optional
maintainer: ${MAINTAINER}
vendor: ${VENDOR}
homepage: ${SOURCE_REPOSITORY}
license: PostgreSQL
description: |
  Debug symbols for the postvec command.
  .
  Install alongside postvec-cli to get readable backtraces from a crash in the
  CLI. Never needed to run it.

contents:
  - src: ${CELL_DIR}/debug/postvec.debug
    dst: /usr/lib/debug/usr/bin/postvec.debug
    file_info: { mode: 0644, owner: root, group: root }
  - src: ${REPO_ROOT}/postvec/LICENSE
    dst: ${LICENSE_DST}/postvec-cli-${DEBUG_SUFFIX}/${LICENSE_NAME}
    file_info: { mode: 0644, owner: root, group: root }
  # See postvec-cli.yaml: one changelog per release, shipped by every package.
  - src: ${CHANGELOG_FILE}
    dst: /usr/share/doc/postvec-cli-${DEBUG_SUFFIX}/${CHANGELOG_NAME}
    file_info: { mode: 0644, owner: root, group: root }

overrides:
  deb:
    depends:
      - postvec-cli (= ${POSTVEC_VERSION}-${PKG_RELEASE})
  rpm:
    depends:
      - postvec-cli = ${POSTVEC_VERSION}-${PKG_RELEASE}

rpm:
  group: Development/Debug

umask: 0022
