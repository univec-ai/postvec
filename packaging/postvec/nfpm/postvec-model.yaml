# One reviewed embedding model from the registry public channel, pinned
# by archive SHA-256. Facts come from model-facts.env. Architecture
# independent. Version is <registry revision>.<bundle version>.0, not
# postvec's. Changing weights behind the same name would make new
# vectors incomparable: publish a new name.

name: ${MODEL_PKG_NAME}
arch: ${NOARCH}
platform: linux
version: ${MODEL_PKG_VERSION}
release: ${PKG_RELEASE}
section: database
priority: optional
maintainer: ${MAINTAINER}
vendor: ${VENDOR}
# The registry's `source` is free-form provenance, not a homepage: it may name
# an exact upstream commit, which is not a page anyone should be sent to as
# "the project". It is recorded verbatim in SOURCE.json and in the copyright
# file instead.
homepage: ${SOURCE_REPOSITORY}
license: ${MODEL_LICENSE}
# Every line of the extended description must stay under 80 characters *after*
# substitution, which is why the long values (the model name, the archive
# digest, the doc path) each start a line of their own.
description: |
  ${MODEL_NAME} as a postvec engine model bundle.
  .
  A ${MODEL_TARGET_DIM}-dimensional sentence-embedding model with a
  ${MODEL_SEQUENCE_LEN}-token context, installed under
  /opt/postvec/models where postvec's embedded inference engine
  loads it. Licensed ${MODEL_LICENSE}.
  .
  Taken from the postvec model registry's public channel, revision
  ${MODEL_REGISTRY_REVISION}, archive sha256:
  ${MODEL_ARCHIVE_SHA256}
  .
  The upstream source, the per-file digests and that pin are recorded in
  ${MODEL_DOC_DIR}/SOURCE.json
  .
  The model name postvec knows this by is
  ${MODEL_NAME}
  Vectors stored under that name are only comparable to vectors produced by
  this model.

contents:
  - src: ${MODEL_PAYLOAD_DIR}/opt/postvec/models
    dst: /opt/postvec/models
    type: tree
    file_info: { owner: root, group: root }
  - src: ${MODEL_PAYLOAD_DIR}${MODEL_DOC_DIR}/SOURCE.json
    dst: ${MODEL_DOC_DIR}/SOURCE.json
    file_info: { mode: 0644, owner: root, group: root }
  - src: ${MODEL_PAYLOAD_DIR}${MODEL_DOC_DIR}/model-files.sha256
    dst: ${MODEL_DOC_DIR}/model-files.sha256
    file_info: { mode: 0644, owner: root, group: root }
  # Per family, and deliberately not the same file. A Debian copyright must
  # reference /usr/share/common-licenses/<id> rather than repeat the text; an
  # RPM's /usr/share/licenses has no such common copy and wants the full
  # licence. Either way the verbatim licence travels with the weights under
  # /opt, which is what a redistribution licence requires.
  - src: ${MODEL_LICENSE_SRC}
    dst: ${LICENSE_DST}/${MODEL_PKG_NAME}/${LICENSE_NAME}
    file_info: { mode: 0644, owner: root, group: root }
  # See postvec-cli.yaml: one changelog per release, shipped by every package.
  - src: ${CHANGELOG_FILE}
    dst: ${MODEL_DOC_DIR}/${CHANGELOG_NAME}
    file_info: { mode: 0644, owner: root, group: root }

rpm:
  group: Applications/Databases

umask: 0022
# Timestamps come from SOURCE_DATE_EPOCH, which nfpm honours directly — an
# explicit `mtime:` here would be parsed before environment expansion.
