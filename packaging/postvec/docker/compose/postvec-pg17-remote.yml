# postvec against remote inference nodes: inference shared between
# services, on a GPU, or isolated from PostgreSQL's crash domain.
# (postvec.mode defaults to 'embedded'; this image pins 'grpc'.)
#
# The nodes are `postvec-server`, which this repository ships as a package
# (`postvec-server` .deb/.rpm) and as an image
# (ghcr.io/univec-ai/postvec-server:0.3.0-1). This file points at hosts you
# operate; postvec-server.yml beside it runs one node as a container.
#
# Volume path: PostgreSQL 16 and 17 images store data in
# /var/lib/postgresql/data, PostgreSQL 18 in /var/lib/postgresql. This file
# is for 17; see postvec-pg18-local.yml for the 18 layout. Changing the
# image tag from pg17 to pg18 against the same volume leaves the data
# directory on the old major. A PostgreSQL major upgrade needs pg_upgrade
# or dump/restore.

services:
  db:
    image: ghcr.io/univec-ai/postvec:0.3.0-1-pg17-remote
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTVEC_DATABASES: app
      POSTVEC_MODE: grpc
      # Comma-separated; order drives round-robin. List every node — the same
      # enabled models must be loaded on all of them, or a conversion routed
      # at a node that lacks its converter fails intermittently. Check with
      # `postvec-server status --fleet` on any node.
      #
      # gRPC is plaintext, so these endpoints must be inside the same trusted
      # private network as the nodes themselves.
      POSTVEC_GRPC_ENDPOINTS: "inference-1.internal:33333,inference-2.internal:33333"
      # Used for GET /config model discovery. postvec accepts a node's
      # self-signed certificate on a trusted network.
      POSTVEC_HTTP_ENDPOINTS: "https://inference-1.internal:22222,https://inference-2.internal:22222"
    secrets:
      - postgres-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postvec-data:/var/lib/postgresql/data
    shm_size: 1gb
    stop_grace_period: 60s
    restart: unless-stopped

secrets:
  postgres-password:
    file: ./secrets/postgres-password

volumes:
  postvec-data:
