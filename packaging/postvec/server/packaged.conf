# Installed by the postvec-server package as
# /usr/lib/systemd/system/postvec-server.service.d/packaged.conf.
#
# The unit is the crate's reference unit, shipped verbatim, and reads the
# engine root /opt/postvec read-only. The node manages models through its
# loopback admin API, or through the dashboard when the operator opts in
# with `--manage`, so it needs to write under /opt/postvec/models: the
# directory, its backend subdirectories and the model directories are handed
# to the service account at every start (as root, the `+` prefix), whichever
# package created them, and that subtree is writable inside the unit's
# otherwise read-only root. Model files stay package-owned; only the
# directories change hands, which is what activating or deactivating a
# packaged model (rewriting its descriptor) needs. Package-owned models
# cannot be removed through the API. A root `postvec model` on the same host
# still accepts the models directory: the node's account is the one owner it
# trusts besides itself.
#
# Certificates: the packaged config.json names /etc/postvec-server/server.crt
# and server.key. /opt/postvec is root-owned for the service account, so a
# pair could neither be created nor (as a 0600 root key) read there.
# /etc/postvec-server is already in the unit's ReadOnlyPaths.
# Managed databases: add managed[] to /etc/postvec-server/config.json.
# Password files in that directory: owner postvec-server, mode 0600.
[Service]
ReadWritePaths=/opt/postvec/models
ExecStartPre=+/bin/sh -c 'install -d -m 0755 /opt/postvec/models && chown postvec-server /opt/postvec/models /opt/postvec/models/*/ /opt/postvec/models/*/*/ 2>/dev/null; :'
