# Installed by the postvec-server package as
# /usr/lib/systemd/system/postvec-server.service.d/packaged.conf.
#
# The unit itself is the crate's reference unit, shipped verbatim; it names
# /var/lib/postvec-server as the engine root because that is the right default
# for a node built from a checkout. On a host that installed *packages*, the
# runtime (postvec-onnxruntime) and the model (postvec-model-*) are under
# /opt/postvec — the same root the postvec command manages and embedded mode
# reads — so this drop-in points the node there. Nothing needs copying, and
# `postvec model pull` on the node writes where the node looks.
#
# The node can manage models through its loopback admin API, or through the
# dashboard when the operator opts in with `--manage`, so it needs to write
# under /opt/postvec/models: the directory, its backend subdirectories and
# the model directories are handed to the service account at every start (as
# root, the `+` prefix), whichever package created them, and that subtree is
# writable inside the unit's otherwise read-only /opt/postvec. Model files
# stay package-owned; only the directories change hands, which is what
# activating or deactivating a packaged model (rewriting its descriptor)
# needs. Package-owned models cannot be removed through the API. A root `postvec model`
# on the same host still accepts the models directory: the node's account
# is the one owner it trusts besides itself.
#
# To keep a node's inventory separate from a local cluster's, delete this file
# (or `systemctl edit postvec-server` and set POSTVEC_SERVER_ROOT back) and
# populate /var/lib/postvec-server instead.
#
# Certificates: the packaged config.json names /etc/postvec-server/server.crt
# and server.key — /opt/postvec is root-owned for the service account, so a
# pair could neither be created nor (as a 0600 root key) read there.
# /etc/postvec-server is already in the unit's ReadOnlyPaths.
# Managed databases: add managed[] to /etc/postvec-server/config.json.
# Password files in that directory: owner postvec-server, mode 0600.
[Service]
Environment=POSTVEC_SERVER_ROOT=/opt/postvec
ReadOnlyPaths=/opt/postvec
ReadWritePaths=/opt/postvec/models
ExecStartPre=+/bin/sh -c 'install -d -m 0755 /opt/postvec/models && chown postvec-server /opt/postvec/models /opt/postvec/models/*/ /opt/postvec/models/*/*/ 2>/dev/null; :'
