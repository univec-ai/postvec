# The one registry schema implementation.
#
# Everything that reads or writes a registry index (postvec-cli and the
# publisher) validates through this crate, so the two cannot drift. It also
# owns the descriptor, identity and archive rules both must apply
# identically.
#
# The default build stays tiny — serde + serde_json and nothing else — so the
# gateway's production build gains two dependencies rather than a tar
# implementation it never calls. The `archive` feature adds the deterministic
# writer and strict reader for the two callers that move archives.
[package]
name = "registry-schema"
version = "0.1.0"
edition = "2021"
description = "The postvec model-registry index schema: types, validation, name rules"
license = "PostgreSQL"
repository = "https://github.com/univec-ai/postvec"

[features]
# The deterministic tar writer and the strict, bounded reader. Enabled by
# postvec-cli (which extracts) and the publisher (which writes and then
# re-reads through the client's exact reader). Not by a gateway that only
# validates an index.
archive = ["dep:sha2", "dep:tar", "dep:hex"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# `archive` only.
hex = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }
tar = { version = "0.4", optional = true }

[dev-dependencies]
# The archive round-trip tests write and re-read real files.
tempfile = "3"
