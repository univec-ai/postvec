# postvec CI (plan task 1.9). Scoped to the paths that feed postvec.so —
# plus proto/**, because the proto-drift test compares against the canonical
# proto and must run when *that* side changes too. Installs cargo-pgrx + a managed PG per matrix major,
# builds pgvector into the PG 18 cluster, then runs fmt / clippy / tests.
#
# Matrix: the thin test suite runs on every advertised major (16/17/18) —
# P4's adopt()/migration-safety code reads version-sensitive catalog state
# (attstattarget, attcompression, pg_depend/pg_partition_tree shapes), so
# compiling alone does not validate it. The embedded suite and the packaging
# smoke stay PG 18-only (the release target; their behavior is
# PG-version-independent).
name: postvec-ci

on:
  push:
    # Feature branches iterate without burning CI minutes; every merge
    # still runs via the pull_request trigger below.
    branches: [main]
    paths:
      - "postvec/**"
      - "core/**"
      - "postvec-server/src/managed/**"
      - "postvec-server/tests/managed*.rs"
      - "proto/**"
      # embedded mode compiles these workspace crates into postvec.so
      - "engine/**"
      - "shared/**"
      # ...and the provider gateway (behind the wire feature).
      - "providers/**"
      - ".github/workflows/postvec-ci.yml"
  pull_request:
    paths:
      - "postvec/**"
      - "core/**"
      - "postvec-server/src/managed/**"
      - "postvec-server/tests/managed*.rs"
      - "proto/**"
      - "engine/**"
      - "shared/**"
      # ...and the provider gateway (behind the wire feature).
      - "providers/**"
      - ".github/workflows/postvec-ci.yml"
  workflow_dispatch:

# Supersede an in-flight run on the same ref rather than letting the two
# race to the same answer. A push that fixes the push before it makes the
# earlier run's verdict irrelevant the moment it lands, and on a private
# repository that run is still being paid for by the minute until it ends.
concurrency:
  group: postvec-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pgver: [16, 17, 18]
    env:
      PGRX_VERSION: "0.18.1"
      PGVER: ${{ matrix.pgver }}
      PGVECTOR_TAG: "v0.8.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The PG 18 cell runs the thin and embedded builds, three pgrx suites, the
      # dump/restore smoke and a package smoke in one target directory — most of
      # a hosted runner's free disk even on a clean build. When a lockfile
      # changes, rust-cache restores the previous build from a fallback key and
      # the new crate versions compile beside it, so the job outgrew the disk at
      # its last step (ENOSPC, 2026-09-18). These preinstalled toolchains are
      # unused here.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libclang-dev clang \
            pkg-config libssl-dev flex bison libreadline-dev zlib1g-dev \
            libicu-dev protobuf-compiler

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: postvec
          key: pg${{ matrix.pgver }}

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version "${PGRX_VERSION}" --locked

      - name: Init pgrx PG ${{ matrix.pgver }}
        run: cargo pgrx init "--pg${PGVER}" download

      - name: Build pgvector into the pgrx cluster
        run: |
          # The glob is the point — pgrx installs under a full version it
          # chooses (18.4), not under the major. Unquoted so it expands, then
          # captured so nothing downstream re-splits it.
          PG_CONFIG="$(echo "$HOME"/.pgrx/"${PGVER}".*/pgrx-install/bin/pg_config)"
          git clone --branch "${PGVECTOR_TAG}" --depth 1 \
            https://github.com/pgvector/pgvector.git /tmp/pgvector
          make -C /tmp/pgvector PG_CONFIG="$PG_CONFIG"
          make -C /tmp/pgvector PG_CONFIG="$PG_CONFIG" install

      - name: rustfmt
        working-directory: postvec
        run: cargo fmt --check

      - name: clippy
        working-directory: postvec
        run: cargo clippy --all-targets --no-default-features --features "pg${PGVER},pg_test" -- -D warnings

      - name: cargo pgrx test
        working-directory: postvec
        run: cargo pgrx test "pg${PGVER}"

      # Cross-session concurrency suite: its own invocation (and therefore its
      # own cluster), because it commits fixtures that the parallel suite above
      # would otherwise observe. Proves lock/waiter behaviour a
      # single-transaction #[pg_test] cannot reach.
      - name: cargo pgrx test (cross-session concurrency)
        working-directory: postvec
        env:
          RUST_TEST_THREADS: 1
        run: cargo pgrx test "pg${PGVER}" --features pg_test_concurrency tests_concurrency

      # Embedded mode (Arch B): lint + full suite with the in-process engine
      # compiled in. Adds the embedded marshalling / error-taxonomy /
      # loopback-server tests; needs no model assets. The clippy step runs on
      # every matrix major (pg_sys bindings differ per major — a pg16-only
      # embedded build break must not ship undetected); the test run is
      # PG 18 only, as the embedded behavior is PG-version-independent.
      - name: clippy (embedded)
        working-directory: postvec
        run: cargo clippy --all-targets --no-default-features --features "pg${PGVER},pg_test,embedded" -- -D warnings

      - name: cargo pgrx test (embedded)
        if: matrix.pgver == 18
        working-directory: postvec
        run: cargo pgrx test "pg${PGVER}" --features embedded

      # P5 dump/restore smoke: a chunked entry with ready/pending/dead work
      # survives pg_dump/restore — destination + sequence position + trigger
      # attachments to the shared functions + markers + post-restore
      # lifecycle. Uses the extension the test step installed into the pgrx
      # dir; PG 18 only (dump format behavior is PG-version-independent).
      - name: dump/restore smoke (P5)
        if: matrix.pgver == 18
        working-directory: postvec
        run: POSTVEC_TEST_MANAGED=1 ./dump_restore_smoke.sh

      # Smoke-test the packaging path (control-file @CARGO_VERSION@
      # substitution, install-SQL generation, staging-tree layout) so it isn't
      # first exercised at release time. --debug: the fat-LTO release profile
      # is too slow for CI and adds nothing to this check.
      - name: cargo pgrx package (smoke)
        if: matrix.pgver == 18
        working-directory: postvec
        run: |
          cargo pgrx package --debug --no-default-features --features "pg${PGVER}" \
            --pg-config "$(echo "$HOME"/.pgrx/"${PGVER}".*/pgrx-install/bin/pg_config)"
          STAGE="target/debug/postvec-pg${PGVER}"
          so="$(find "$STAGE" -name postvec.so)"
          ctl="$(find "$STAGE" -name postvec.control)"
          sql="$(find "$STAGE" -name 'postvec--*.sql')"
          for f in "$so" "$ctl" "$sql"; do
            # `if`, not `A && B || C`: with the latter, C runs whenever B fails
            # too, which here would be the right answer for the wrong reason.
            if [ -z "$f" ] || [ ! -s "$f" ]; then
              echo "missing packaged asset"; exit 1
            fi
          done
          grep -q "default_version = '0.1.0'" "$ctl"
