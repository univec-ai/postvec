# postvec-server CI. Separate from postvec-ci.yml for the same reason
# postvec-cli-ci.yml is: this is an ordinary workspace crate, so it needs no
# cargo-pgrx, no managed PostgreSQL and no pgvector, and it runs in seconds.
#
# The tests are hermetic. Nothing here needs ONNX Runtime: every case is a
# refusal or a rendering that happens before the engine would create a native
# session, and the listeners bind ephemeral loopback ports. The suite that
# does need real model assets is the packaging image smoke test.
name: postvec-server-ci

on:
  push:
    # Feature branches iterate without burning CI minutes; every merge
    # still runs via the pull_request trigger below.
    branches: [main]
    paths:
      - "postvec-server/**"
      - "core/**"
      - "postvec/sql/managed/**"
      # The engine it links and the wire contract it serves.
      - "engine/**"
      - "shared/**"
      # The provider gateway it mounts.
      - "providers/**"
      - "proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/postvec-server-ci.yml"
  pull_request:
    paths:
      - "postvec-server/**"
      - "core/**"
      - "postvec/sql/managed/**"
      - "engine/**"
      - "shared/**"
      # The provider gateway it mounts.
      - "providers/**"
      - "proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/postvec-server-ci.yml"
  workflow_dispatch:

# Supersede an in-flight run on the same ref rather than letting the two
# race to the same answer. A push that fixes the push before it makes the
# earlier run's verdict irrelevant the moment it lands, and on a private
# repository that run is still being paid for by the minute until it ends.
concurrency:
  group: postvec-server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"

      # protoc compiles ../proto/ninference.proto; libssl-dev is the TLS
      # listener's backend (OpenSSL rather than rustls, matching the pinned
      # packaging builder image).
      #
      # libprotobuf-dev is what ships the well-known types
      # (/usr/include/google/protobuf/*.proto) that the contract imports —
      # protobuf-compiler only Recommends it, and --no-install-recommends
      # drops it, so protoc resolves as installed and then fails on
      # `import "google/protobuf/struct.proto"`. The other workflows get it
      # implicitly by not passing the flag; this one has to name it.
      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev libssl-dev

      - name: rustfmt
        run: cargo fmt -p postvec-server -p postvec-core -- --check

      - name: clippy
        run: cargo clippy -p postvec-server -p postvec-core --all-targets -- -D warnings

      - name: test
        run: cargo test -p postvec-server -p postvec-core --all-targets

      # The provider gateway both inference hosts mount. Before this job, a
      # providers-only change triggered no CI at all, and its own suite ran
      # in no workflow — a broken server-image build context reached a local
      # release run exactly that way. Compiling as a dependency of the crates
      # above is not running its tests.
      - name: clippy (postvec-providers)
        run: |
          cargo clippy -p postvec-providers --features wire,test-util \
            --all-targets -- -D warnings
      - name: test (postvec-providers)
        run: |
          cargo test -p postvec-providers --features wire,test-util \
            --all-targets

      # The trimmed engine fork and its shared types carry their own
      # integration suites, which nothing else runs. Tests only, no clippy:
      # engine has a known cosmetic lint (see engine/FORK.md) whose fix
      # belongs to the next fork sync, not a CI-appeasing local diff —
      # the fork rule is that a diff against upstream shows absences, not
      # differences.
      - name: test (engine, shared)
        run: cargo test -p engine -p shared --all-targets

      # The GPU feature changes which execution providers the engine compiles
      # in. It is never exercised on a CI runner, so at least prove it still
      # type-checks — a feature that only ever builds one way breaks the
      # other silently.
      - name: check (ort-cuda)
        run: cargo check -p postvec-server --features ort-cuda

      # This crate is under its own licence while the rest of the repository
      # is PostgreSQL-licensed. The manifest and the directory LICENSE are what
      # a downstream packager reads, and a copy-paste from a neighbouring
      # crate would silently relicense it. The identifier is pinned once, as
      # SERVER_LICENSE in packaging/postvec/versions.env — it is what the
      # postvec-server package and image declare — and the release gate
      # (packaging/postvec/scripts/assert-versions.sh) asserts the same facts;
      # this repeats them in the cheap workflow so the failure is seconds away
      # rather than a Docker matrix away.
      - name: license metadata
        run: |
          licence="$(sed -n 's/^SERVER_LICENSE=//p' packaging/postvec/versions.env)"
          test -n "${licence}"
          test -f postvec-server/LICENSE
          grep -q "^license = \"${licence}\"$" postvec-server/Cargo.toml
          case "${licence}" in BUSL-1.1) name="Business Source License 1.1" ;; Elastic-2.0) name="Elastic License 2.0" ;; Apache-2.0) name="Apache License 2.0" ;; *) name="${licence}" ;; esac
          grep -qF "| \`postvec-server/\` | ${name} |" LICENSING.md

      # The whole point of the two-listener design is that the socket
      # published to the network carries no route that can mutate the engine.
      # The integration suite asserts it at runtime; this catches a route
      # added to the wrong router before the tests even run.
      - name: no admin routes on the public listener
        run: |
          if grep -n '"/admin/' postvec-server/src/http.rs; then
            echo "::error::/admin routes belong in admin.rs, on the loopback listener"
            exit 1
          fi
