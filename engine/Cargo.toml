[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "Inference engine postvec embeds for in-database inference (trimmed fork)."
license = "PostgreSQL"
repository = "https://github.com/univec-ai/postvec"
homepage = "https://github.com/univec-ai/postvec/tree/main/engine"

[dependencies]
shared = { path = "../shared" }
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }
ndarray = { version = "0.16.1", features = ["serde"] }
# HeaderMap in the execution context.
axum = { version = "0.7" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0.99"
thiserror = "1.0"
log = "0.4"
# Renamed so it does not collide with the crate's own `tokenizers` module.
hf_tokenizers = { package = "tokenizers", version = "0.22.0" }
once_cell = "1.19"
# Runtime-dynamic ONNX Runtime (no compile-time `ORT_LIB_LOCATION`).
ort = { version = "2.0.0-rc.10", optional = true, default-features = false, features = ["std", "ndarray", "load-dynamic"] }
# Direct sys types (enum conversions) in `onnx_runtime.rs`.
ort-sys = { version = "2.0.0-rc.10", optional = true, default-features = false }
rayon = "1.10"
unicode-normalization = "0.1.23"
async-trait = "0.1.77"
deadpool = { version = "0.12.3", features = ["managed"] }
num_cpus = "1"
tracing = "0.1.41"
dashmap = "6.1.0"
base64 = "0.22"
# Per-`input_type` wrappers (search_query / search_document).
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }

[dev-dependencies]
tempfile = "3"

[features]
onnx = ["dep:ort", "dep:ort-sys"]
# `cargo build --features onnx,ort-cuda`
ort-cuda = ["ort/cuda"]
# `cargo build --features onnx,ort-tensorrt`
ort-tensorrt = ["ort/tensorrt"]


